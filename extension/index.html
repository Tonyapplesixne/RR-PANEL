<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RR TOOLS</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">RR</span>
        <div>
          <strong>RR TOOLS</strong>
          <em>AE Panel</em>
        </div>
        <button type="button" id="sidebar-toggle" class="rail-toggle" aria-label="Collapse sidebar">⟨</button>
      </div>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <span class="live" aria-hidden="true"></span>
        <strong>RR TOOLS</strong>
        <span class="ver">1.0.0</span>
      </div>
    </aside>
    <div id="workspace">
      <header class="topbar">
        <div id="host-pill" class="pill">Checking</div>
      </header>
      <div id="notice" class="notice" hidden></div>
      <div id="stage">
        <main id="view"></main>
        <aside id="detail"></aside>
      </div>
    </div>
  </div>
  <script src="js/CSInterface.js"></script>
  <script src="js/util.js"></script>
  <script src="js/preferences.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/cepfs.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/view.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
