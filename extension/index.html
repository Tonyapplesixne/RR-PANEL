<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RR TOOLS</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img class="logo-full" src="assets/branding/logos/rr-crown.png" alt="RR TOOLS">
        <img class="logo-compact" src="assets/branding/logos/rr-crown.png" alt="RR TOOLS">
        <div class="brand-copy">
          <strong>RR TOOLS</strong>
          <em>After Effects Toolkit</em>
        </div>
        <button type="button" id="sidebar-toggle" class="rail-toggle" data-action="toggle-sidebar" aria-label="Expand sidebar"><span class="when-compact">⟩</span><span class="when-wide">⟨</span></button>
      </div>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <img src="assets/branding/logos/rr-crown.png" alt="">
        <div>
          <strong>After Effects</strong>
          <span id="side-version" class="ver">Checking</span>
        </div>
      </div>
    </aside>
    <div id="workspace">
      <header class="topbar">
        <div class="top-brand">
          <img class="top-logo" src="assets/branding/logos/rr-crown.png" alt="">
          <div class="top-lockup">
            <strong>RR TOOLS</strong>
            <em>After Effects Toolkit</em>
          </div>
        </div>
        <div id="host-pill" class="pill">Checking</div>
      </header>
      <div id="notice" class="notice" hidden></div>
      <div id="stage">
        <main id="view"></main>
        <aside id="detail"></aside>
      </div>
    </div>
  </div>
  <script src="js/CSInterface.js"></script>
  <script src="js/util.js"></script>
  <script src="js/preferences.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/cepfs.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/view.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
